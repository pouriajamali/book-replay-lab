name: Verify replay correctness and source package
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  linux:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 demo_recovery.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 verify.py --compiler g++ --report .build/legacy-correctness.json
      - run: python3 verify_flat.py --compiler g++ --report .build/flat-correctness.json
      - name: Build exact source package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/source_package.py build --commit "$SOURCE_SHA"
      - name: Inspect actual source ZIP against Git
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/source_package.py check --commit "$SOURCE_SHA" --repository .
      - uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: checked-source-linux
          path: .build/release-v1.2.1-preview.1/
          include-hidden-files: true
          if-no-files-found: error
  windows:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - shell: msys2 {0}
        run: python demo_recovery.py
      - shell: msys2 {0}
        run: python -m unittest discover -s tests -v
      - shell: msys2 {0}
        run: python verify.py --compiler g++ --report .build/legacy-correctness.json
      - shell: msys2 {0}
        run: python verify_flat.py --compiler g++ --report .build/flat-correctness.json
      - name: Build exact source package
        shell: msys2 {0}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/source_package.py build --commit "$SOURCE_SHA"
      - name: Inspect actual source ZIP against Git
        shell: msys2 {0}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/source_package.py check --commit "$SOURCE_SHA" --repository .
      - uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: checked-source-windows
          path: .build/release-v1.2.1-preview.1/
          include-hidden-files: true
          if-no-files-found: error
  compare-packages:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checked-source-*
          path: checked
      - name: Compare actual checked packages without rebuilding
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          directories = sorted(Path('checked').iterdir())
          assert len(directories) == 2
          expected = {'book-replay-lab-v1.2.1-preview.1.zip', 'SOURCE-MANIFEST.json', 'SIGNING-PUBLIC-KEY.pub', 'SHA256SUMS.txt'}
          assert all({p.name for p in d.iterdir()} == expected for d in directories)
          hashes = {}
          for name in sorted(expected):
              first, second = [(d / name).read_bytes() for d in directories]
              assert first == second, name
              hashes[name] = hashlib.sha256(first).hexdigest()
          print(json.dumps({'status': 'BOTH_OS_SOURCE_PACKAGES_IDENTICAL_NO_REBUILD', 'sha256': hashes}, sort_keys=True))
